[pytest]
testpaths = tests
python_files = test_*.py

# -p no:faulthandler is deliberate, not a way of hiding a crash.
#
# The OpenRocket tests run a real JVM in-process through JPype. The JVM uses
# guard-page access violations as a normal part of its operation -- null-check
# elimination and stack banging both rely on catching SIGSEGV -- and handles
# them itself. pytest enables faulthandler by default, which intercepts those
# faults first and prints a long "Windows fatal exception: access violation"
# traceback for what is ordinary JVM behaviour. The run continues and passes;
# the output is simply alarming and wrong.
#
# If a test ever does crash the interpreter for real, drop this flag to see it.
addopts = -q -p no:faulthandler
